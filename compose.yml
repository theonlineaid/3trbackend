version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .

    container_name: node_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}

    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  default:
    external: true
    name: 3tr-net